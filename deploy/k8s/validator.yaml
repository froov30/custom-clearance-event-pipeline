apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: ccp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      terminationGracePeriodSeconds: 30 # SIGTERM finishes the in-flight message, then closes (A11)
      enableServiceLinks: false
      containers:
        - name: validator
          image: ccp:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ccp.validator"]
          envFrom:
            - configMapRef: { name: ccp-config }
            - secretRef: { name: ccp-mongo }
          livenessProbe: # heartbeat younger than 60 s (D-053, D-059)
            exec:
              command: ["python", "-m", "ccp.common.probe", "validator"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 192Mi }
