# Reach it with: kubectl -n ccp port-forward svc/api 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ccp
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ccp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      enableServiceLinks: false
      containers:
        - name: api
          image: ccp:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ccp.api"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ccp-config }
            - secretRef: { name: ccp-mongo }
          readinessProbe: # /health never waits on MongoDB (D-057)
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
