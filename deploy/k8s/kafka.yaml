# Single-broker KRaft Kafka. One PLAINTEXT listener advertised as the Service name; nothing outside the cluster
# talks to it (ARCHITECTURE §5). No volume, as in Compose (D-045): topics are recreated by the topics Job.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ccp
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ccp
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: apache/kafka-native:4.3.1
          ports:
            - containerPort: 9092
          env:
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qg }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENERS, value: "CONTROLLER://:9093,PLAINTEXT://:9092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z localhost 9092"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "nc -z localhost 9092"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { memory: 256Mi }
            limits: { memory: 512Mi }
