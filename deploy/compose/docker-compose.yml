# Synthetic-data demo stack. Run from the repo root (DECISIONS.md D-044):
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml up -d --wait
# Ports bind to 127.0.0.1 only. Volumes and images live in Docker's disk image, which must be on D: (D-040).
name: ccp

# Shared settings for the containerised services (profile `app`, P10). Anchors must come before use.
x-ccp: &ccp
  image: ccp:0.1.0
  profiles: [app]
  restart: unless-stopped
  mem_limit: 192m
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    MONGO_HOST: mongo
    MONGO_PORT: "27017"
    MONGO_USER: ${MONGO_USER:?set MONGO_USER in .env}
    MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    MONGO_DB: ${MONGO_DB:-ccp}
    HOLD_ALERT_SECONDS: ${HOLD_ALERT_SECONDS:-20}
    MONITOR_SCAN_SECONDS: ${MONITOR_SCAN_SECONDS:-5}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

# The probe allows 60 s without a heartbeat, above the 14.7 s worst case during a MongoDB outage (D-053).
x-probe-timing: &probe-timing
  interval: 15s
  timeout: 10s
  start_period: 30s
  retries: 3

services:
  kafka:
    image: apache/kafka-native:4.3.1  # fallback: apache/kafka:4.3.1 (A3)
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: in-network name for containers, localhost for the host venv (ARCHITECTURE §5).
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092  # D-046
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # D-035
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # shortcut: no volume, so topics and offsets reset on `down`/recreate; add one if a run must survive that (D-045).
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 3s
      retries: 24
    mem_limit: 512m

  mongo:
    image: mongo:8.0.32
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # Applied only when the volume is first initialised; changing them later needs `down -v`.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 512m

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [ui]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ccp
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  # --- Release 1: the services as containers (profile `app`, P10). One image, one command each (D-008).
  topics-init:
    <<: *ccp
    command: ["python", "-m", "ccp.common.topics"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  validator:
    <<: *ccp
    command: ["python", "-m", "ccp.validator"]
    depends_on:
      topics-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *probe-timing
      test: ["CMD", "python", "-m", "ccp.common.probe", "validator"]

  processor:
    <<: *ccp
    command: ["python", "-m", "ccp.processor"]
    depends_on:
      topics-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      <<: *probe-timing
      test: ["CMD", "python", "-m", "ccp.common.probe", "processor"]

  monitor:
    <<: *ccp
    command: ["python", "-m", "ccp.monitor"]
    depends_on:
      topics-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      <<: *probe-timing
      test: ["CMD", "python", "-m", "ccp.common.probe", "monitor"]

  api:
    <<: *ccp
    command: ["python", "-m", "ccp.api"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      <<: *probe-timing
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]

  # One-off producer: docker compose ... run --rm simulator --seed 42
  simulator:
    <<: *ccp
    profiles: [tools]
    entrypoint: ["python", "-m", "ccp.simulator"]
    command: []
    restart: "no"

volumes:
  mongo-data:
